services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsaqr_saas}
      POSTGRES_USER: ${POSTGRES_USER:-alsaqr_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_this_password}
    ports:
      - "5433:5432"
    volumes:
      - saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alsaqr_app} -d ${POSTGRES_DB:-alsaqr_saas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alsaqr_app:local_dev_change_this_password@db:5432/alsaqr_saas}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-this-to-a-random-value-at-least-32-chars}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-20}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - saas_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  saas_pgdata:
  saas_node_modules:
