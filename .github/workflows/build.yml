name: Build AlSaqr Accounting Desktop

on:
  push:
    branches:
      - main
      - feature/real-accounting-core-20261013
      - desktop-accounting-core-20261013
      - feature/erp-pos-cashier-20261013
      - fix/clean-desktop-build-20261013-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows x64 dependencies
        run: |
          dotnet restore AlSaqr.Accounting.csproj -r win-x64
          dotnet restore tests/AlSaqr.Accounting.Smoke/AlSaqr.Accounting.Smoke.csproj -r win-x64
          dotnet restore tools/AlSaqr.LicenseIssuer/AlSaqr.LicenseIssuer.csproj

      - name: Compile Release
        run: dotnet build AlSaqr.Accounting.csproj -c Release -r win-x64 --no-restore

      - name: Build offline license issuer
        run: dotnet build tools/AlSaqr.LicenseIssuer/AlSaqr.LicenseIssuer.csproj -c Release --no-restore

      - name: Verify license issuer rejects a mismatched signing key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDir = Join-Path $env:RUNNER_TEMP 'AlSaqrLicenseIssuerKeyGuard'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $privateKeyPath = Join-Path $testDir 'wrong-key.pem'
          $requestPath = Join-Path $testDir 'request.json'
          $outputPath = Join-Path $testDir 'must-not-be-issued.json'

          $wrongKey = [System.Security.Cryptography.ECDsa]::Create()
          if ($null -eq $wrongKey) {
            throw 'Could not create a temporary ECDSA provider for the negative test.'
          }
          try {
            $wrongKey.KeySize = 256
            [System.IO.File]::WriteAllText($privateKeyPath, $wrongKey.ExportECPrivateKeyPem())
          } finally {
            $wrongKey.Dispose()
          }

          $request = @{
            productId = 'ALSAQR-ACCOUNTING-DESKTOP'
            productName = 'الصقر لأنظمة المحاسبة'
            licensee = 'CI mismatch-key test'
            machineId = '0123456789ABCDEF0123456789ABCDEF'
            requestedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($requestPath, $request, [System.Text.UTF8Encoding]::new($false))

          & dotnet run --project tools/AlSaqr.LicenseIssuer/AlSaqr.LicenseIssuer.csproj -c Release --no-build -- "$privateKeyPath" "$requestPath" "CI mismatch-key test" "2027-12-31" "$outputPath" "Accounting,POS"
          $issuerExitCode = $LASTEXITCODE
          if ($issuerExitCode -eq 0) {
            throw 'The issuer accepted a key that does not match the application public key.'
          }
          if (Test-Path -LiteralPath $outputPath) {
            throw 'The issuer wrote an invalid license file despite rejecting the key.'
          }
          Write-Host 'PASS: mismatched signing key rejected before a license file is written.' -ForegroundColor Green

      - name: Run accounting integration smoke tests
        run: dotnet run --project tests/AlSaqr.Accounting.Smoke/AlSaqr.Accounting.Smoke.csproj -c Release -r win-x64 --no-restore

      - name: Publish Windows x64 application
        run: dotnet publish AlSaqr.Accounting.csproj -c Release -r win-x64 --no-restore -p:SelfContained=true -o artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlSaqr-Accounting-win-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
