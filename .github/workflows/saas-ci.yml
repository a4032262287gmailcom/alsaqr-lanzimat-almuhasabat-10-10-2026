name: AlSaqr SaaS CI

on:
  push:
    branches:
      - saas-cloud-platform-20261013
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alsaqr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alsaqr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/alsaqr_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/alsaqr_test
      JWT_SECRET_KEY: test-only-secret-key-replace-in-production-0123456789
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: saas/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r saas/backend/requirements.txt

      - name: Apply database migrations
        working-directory: saas/backend
        run: alembic upgrade head

      - name: Static analysis
        working-directory: saas/backend
        run: ruff check app tests --output-format concise

      - name: Run journal, numbering, period-lock and audit tests
        working-directory: saas/backend
        run: pytest -q
