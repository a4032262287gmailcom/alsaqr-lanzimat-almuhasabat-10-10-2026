name: Build Windows Desktop

on:
  push:
    branches: [main, desktop-no-license-window]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AlSaqr.Accounting.csproj
      - run: dotnet build AlSaqr.Accounting.csproj --configuration Release --no-restore
