name: Build Windows Desktop

on:
  push:
    branches: [main, desktop-no-license-window]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AlSaqr.Accounting.csproj
      - name: Build
        run: dotnet build AlSaqr.Accounting.csproj --configuration Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish AlSaqr.Accounting.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlSaqr-Accounting-Windows-x64
          path: publish/
          if-no-files-found: error
